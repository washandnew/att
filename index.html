<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5BEA">
<title>워시앤뉴 출퇴근</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --blue:#2F5BEA;--blue2:#5B82FF;--red:#F04452;--green:#12B76A;
  --ink:#141A24;--sub:#5F6B7A;--hint:#98A2B3;--line:#EEF1F5;--bg:#F3F5F9;--card:#fff;--chip:#F2F4F7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans Myanmar","Myanmar Text","Noto Sans Sinhala","Iskoola Pota","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 64px;border-radius:0 0 28px 28px}
.hero .in{max-width:440px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:15px}
.right{display:flex;gap:6px;align-items:center}
.site{font-size:13px;font-weight:600;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.lang{font:inherit;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:6px 10px;-webkit-appearance:none;appearance:none}
.lang option{color:#141A24}
.wrap{max-width:440px;margin:-44px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:0 6px 24px rgba(20,26,36,.06);margin-bottom:14px}
.hello{font-size:15px;color:var(--sub);font-weight:500}
.who{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.date{font-size:15px;color:var(--sub);margin-top:18px;text-align:center}
.clock{font-size:56px;font-weight:800;letter-spacing:-2px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:20px;padding:24px 12px;font:inherit;font-size:24px;font-weight:800;color:#fff;margin-top:16px;cursor:pointer;transition:transform .08s;text-align:center}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.55}
.b-in{background:var(--blue);box-shadow:0 8px 20px rgba(47,91,234,.35)}
.b-out{background:var(--red);box-shadow:0 8px 20px rgba(240,68,82,.32)}
.b-done{background:var(--chip);color:var(--sub);font-size:19px;padding:20px 12px}
.b-ghost{background:var(--chip);color:var(--ink);font-size:18px;padding:18px 12px;box-shadow:none}
.msg{text-align:center;font-size:15px;font-weight:600;margin-top:14px;min-height:20px}
.ok{color:var(--green)}.err{color:var(--red)}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today div{background:var(--chip);border-radius:16px;padding:14px 16px}
.today span{font-size:13px;color:var(--sub)}.today b{display:block;font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.today .on{background:#EAF0FF}.today .on b{color:var(--blue)}
.menu{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:0 6px 24px rgba(20,26,36,.06);text-decoration:none;color:var(--ink);font-weight:700;font-size:17px;margin-bottom:14px}
.menu small{display:block;font-weight:500;color:var(--hint);font-size:13px;margin-top:2px}.menu em{font-style:normal;color:var(--hint);font-size:22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.name{display:flex;align-items:center;gap:10px;border:0;background:var(--chip);border-radius:16px;padding:14px;font:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;word-break:break-word}
.name:active{background:#E4E8EE}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none;letter-spacing:-.5px}
.hint{color:var(--hint);font-size:13px;text-align:center;margin-top:14px;line-height:1.5;white-space:pre-line}
.warn{background:#FFF4E5;color:#B54708;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px;text-align:center;white-space:pre-line}
.gps{background:#FFF4E5;border:2px solid #F79009;border-radius:20px;padding:18px;margin-bottom:14px;color:#7A2E0E}
.gps b{display:block;font-size:19px;margin-bottom:8px}
.gps p{margin:0;font-size:15px;line-height:1.6;white-space:pre-line}
.gps .btn{background:#F79009;font-size:18px;padding:16px 12px;margin-top:12px;box-shadow:none}
a.link{color:var(--hint);font-size:13px;display:block;text-align:center;margin-top:18px;text-decoration:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.nav button{border:0;background:var(--chip);border-radius:12px;width:42px;height:42px;font-size:20px;color:var(--ink);cursor:pointer}
.nav .t{font-size:20px;font-weight:800}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sum div{background:linear-gradient(135deg,#EEF3FF,#F6F8FF);border-radius:16px;padding:14px 16px}
.sum span{font-size:13px;color:var(--sub)}.sum b{display:block;font-size:24px;font-weight:800;color:var(--blue);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{color:var(--hint);font-weight:600;font-size:12px;text-align:right;padding:0 4px 8px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:12px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.d{color:var(--sub)}td.d .we{color:var(--red)}td.h{font-weight:800}td.miss{color:var(--hint)}td.d .st{display:block;font-size:11px;font-weight:700;white-space:nowrap}td.d .st.p{color:#B54708}td.d .st.y{color:var(--green)}td.d .st.n{color:var(--red)}
.label{font-size:14px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.field{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:17px;color:var(--ink);background:var(--card)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.now{font-size:13px;color:var(--sub);margin-top:8px}
.opts{display:grid;gap:8px}
.opt{border:2px solid transparent;background:var(--chip);border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EAF0FF;color:var(--blue)}
.steps{margin:14px 0 0;padding-left:22px;font-size:16px;line-height:1.6}
.steps li{margin-bottom:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hero"><div class="in"><div class="brand"><i>✓</i>워시앤뉴</div><div class="right"><select class="lang" id="lang" aria-label="Language"></select><div class="site" id="site"></div></div></div></div>
<div class="wrap" id="app"><div class="card"><div class="spin"></div></div></div>
<script>
var Q = new URLSearchParams(location.search);

  site: Q.get('s') || '갈매', setup: Q.get('setup') || '', test: Q.get('test') === '1', 명단: []};

var store = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var dev = store.get('dev');
if (!dev) { dev = Math.random().toString(36).slice(2, 10); store.set('dev', dev); }
var me = store.get('name_' + D.site);
var pos = null, posErr = '', clockTimer = null;
var COLORS = ['#2F5BEA', '#12B76A', '#F79009', '#7A5AF8', '#EE46BC', '#0BA5EC', '#F04452', '#667085'];

// ---------- 언어 ----------
// 사람별 기본 언어 (본인이 위 언어 버튼으로 바꾸면 이 폰에 기억)
var NAME_LANG = {'이현주': 'vi', 'THANT NAING TUN': 'my', 'KYAW PONYA HEIN': 'my', 'YE HTET': 'my',
  'FASRY': 'si', 'DILSHAN': 'si', 'NETHMI': 'si'};
var LANGS = [['ko', '한국어'], ['en', 'English'], ['vi', 'Tiếng Việt'], ['my', 'မြန်မာ'], ['si', 'සිංහල']];
var TX = {
hello:{ko:'안녕하세요',en:'Hello',vi:'Xin chào',my:'မင်္ဂလာပါ',si:'ආයුබෝවන්'},
nim:{ko:'{n} 님',en:'{n}',vi:'{n}',my:'{n}',si:'{n}'},
in:{ko:'출근하기',en:'Clock in',vi:'Vào ca',my:'အလုပ်ဝင်',si:'වැඩට පැමිණීම'},
out:{ko:'퇴근하기',en:'Clock out',vi:'Tan ca',my:'အလုပ်ဆင်း',si:'වැඩ අවසන්'},
done:{ko:'오늘 수고하셨어요 · 퇴근 다시 찍기',en:'Good work today · Clock out again',vi:'Hôm nay vất vả rồi · Bấm tan ca lại',my:'ဒီနေ့ ပင်ပန်းသွားပြီ · အလုပ်ဆင်း ပြန်နှိပ်ရန်',si:'අද හොඳින් වැඩ කළා · නැවත වැඩ අවසන් කරන්න'},
again:{ko:'다시 출근하기 (하루 두 번 근무)',en:'Clock in again (2nd shift today)',vi:'Vào ca lại (ca thứ 2 trong ngày)',my:'ထပ်မံ အလုပ်ဝင် (ဒီနေ့ ဒုတိယအကြိမ်)',si:'නැවත වැඩට පැමිණීම (අද දෙවන වාරය)'},
todayIn:{ko:'오늘 출근',en:'Today in',vi:'Giờ vào hôm nay',my:'ဒီနေ့ ဝင်ချိန်',si:'අද පැමිණි වේලාව'},
todayOut:{ko:'오늘 퇴근',en:'Today out',vi:'Giờ ra hôm nay',my:'ဒီနေ့ ဆင်းချိန်',si:'අද පිටවූ වේලාව'},
mine:{ko:'📋 이번 달 내 근무시간',en:'📋 My hours this month',vi:'📋 Giờ làm tháng này',my:'📋 ဒီလ ကျွန်ုပ်၏ အလုပ်ချိန်',si:'📋 මෙම මාසයේ මගේ වැඩ කාලය'},
mineSub:{ko:'날짜별 출퇴근과 합계를 볼 수 있어요',en:'See each day and the total',vi:'Xem từng ngày và tổng cộng',my:'နေ့အလိုက်နှင့် စုစုပေါင်း ကြည့်နိုင်သည်',si:'දිනපතා සහ මුළු එකතුව බලන්න'},
fix:{ko:'✏️ 기록이 잘못됐어요',en:'✏️ My record is wrong',vi:'✏️ Giờ chấm công bị sai',my:'✏️ မှတ်တမ်း မှားနေသည်',si:'✏️ මගේ වාර්තාව වැරදියි'},
fixSub:{ko:'맞는 시간을 적어 수정 요청',en:'Send the correct time',vi:'Gửi giờ đúng để sửa',my:'မှန်ကန်သော အချိန်ကို ပို့ပါ',si:'නිවැරදි වේලාව යවන්න'},
notMe:{ko:'내 이름이 아니에요',en:'This is not my name',vi:'Đây không phải tên tôi',my:'ဒါ ကျွန်ုပ်နာမည် မဟုတ်ပါ',si:'මෙය මගේ නම නොවේ'},
gpsTitle:{ko:'📍 위치(GPS)를 켜 주세요',en:'📍 Please turn on Location (GPS)',vi:'📍 Vui lòng bật Vị trí (GPS)',my:'📍 တည်နေရာ (GPS) ကို ဖွင့်ပါ',si:'📍 කරුණාකර ස්ථානය (GPS) සක්‍රිය කරන්න'},
gpsBody:{ko:'1. 휴대폰 설정에서 위치(GPS)를 켜요\n2. 인터넷 창에서 위치 권한을 "허용"해요\n3. 아래 버튼을 눌러요\n위치가 꺼져 있으면 출퇴근이 정상 기록되지 않아요',
  en:'1. Turn on Location (GPS) in phone settings\n2. Allow location for this browser\n3. Tap the button below\nWithout location, your time may not be recorded correctly',
  vi:'1. Bật Vị trí (GPS) trong cài đặt điện thoại\n2. Cho phép trình duyệt dùng vị trí ("Cho phép")\n3. Bấm nút bên dưới\nNếu tắt vị trí, giờ chấm công có thể không được ghi đúng',
  my:'1. ဖုန်း ဆက်တင်တွင် တည်နေရာ (GPS) ကို ဖွင့်ပါ\n2. ဘရောက်ဇာကို တည်နေရာ ခွင့်ပြုပါ\n3. အောက်က ခလုတ်ကို နှိပ်ပါ\nတည်နေရာ ပိတ်ထားလျှင် အချိန် မှန်ကန်စွာ မှတ်တမ်းမတင်နိုင်ပါ',
  si:'1. දුරකථන සැකසුම් තුළ ස්ථානය (GPS) සක්‍රිය කරන්න\n2. මෙම බ්‍රව්සරයට ස්ථානයට අවසර දෙන්න\n3. පහත බොත්තම ඔබන්න\nස්ථානය නැතිනම් ඔබේ වේලාව නිවැරදිව සටහන් නොවිය හැක'},
gpsRetry:{ko:'📍 위치 다시 찾기',en:'📍 Try location again',vi:'📍 Tìm lại vị trí',my:'📍 တည်နေရာ ပြန်ရှာပါ',si:'📍 ස්ථානය නැවත සොයන්න'},
gpsFinding:{ko:'위치 찾는 중…',en:'Finding location…',vi:'Đang tìm vị trí…',my:'တည်နေရာ ရှာနေသည်…',si:'ස්ථානය සොයමින්…'},
noGeo:{ko:'이 폰은 위치 기능이 없어요',en:'This phone has no location feature',vi:'Điện thoại không có chức năng vị trí',my:'ဤဖုန်းတွင် တည်နေရာ မရှိပါ',si:'මෙම දුරකථනයේ ස්ථාන පහසුකම නැත'},
denied:{ko:'위치 권한이 꺼져 있어요',en:'Location permission is off',vi:'Quyền vị trí đang tắt',my:'တည်နေရာ ခွင့်ပြုချက် ပိတ်ထားသည်',si:'ස්ථාන අවසරය අක්‍රියයි'},
notFound:{ko:'위치를 못 찾았어요',en:'Could not find location',vi:'Không tìm được vị trí',my:'တည်နေရာ ရှာမတွေ့ပါ',si:'ස්ථානය සොයාගත නොහැක'},
fixOf:{ko:'{n} 님 기록',en:"{n}'s record",vi:'Chấm công của {n}',my:'{n} ၏ မှတ်တမ်း',si:'{n} ගේ වාර්තාව'},
fixTitle:{ko:'수정 요청',en:'Correction request',vi:'Yêu cầu sửa',my:'ပြင်ဆင်ရန် တောင်းဆိုမှု',si:'සංශෝධන ඉල්ලීම'},

  vi:['Khi đến nơi làm, quét mã QR và bấm [Vào ca]','Khi xong việc, quét mã QR lần nữa và bấm [Tan ca]','Chỉ chọn tên của bạn lần đầu tiên. Điện thoại sẽ nhớ','Luôn bật Vị trí (GPS). Nếu tắt, giờ có thể không được ghi đúng','Luôn dùng điện thoại của chính bạn. Không dùng điện thoại người khác','Nếu giờ bị sai hoặc quên bấm, vào [Giờ chấm công bị sai] và gửi giờ đúng. Quản lý duyệt xong sẽ được sửa','Xem giờ từng ngày và tổng cộng trong [Giờ làm tháng này]','Đổi ngôn ngữ bằng nút 🌐 ở phía trên'],
  my:['အလုပ်နေရာ ရောက်လျှင် QR ကို စကန်ဖတ်ပြီး [အလုပ်ဝင်] ကို နှိပ်ပါ','အလုပ်ပြီးလျှင် QR ကို ထပ်စကန်ဖတ်ပြီး [အလုပ်ဆင်း] ကို နှိပ်ပါ','ပထမအကြိမ်သာ သင့်နာမည်ကို ရွေးပါ။ ဤဖုန်းက မှတ်ထားမည်','တည်နေရာ (GPS) ကို အမြဲ ဖွင့်ထားပါ။ ပိတ်ထားလျှင် အချိန် မှန်ကန်စွာ မှတ်တမ်းမတင်နိုင်ပါ','ကိုယ့်ဖုန်းဖြင့်သာ နှိပ်ပါ။ အခြားသူ၏ ဖုန်းကို မသုံးပါနှင့်','အချိန် မှားလျှင် သို့မဟုတ် မနှိပ်မိလျှင် [မှတ်တမ်း မှားနေသည်] တွင် မှန်ကန်သော အချိန်ကို ပို့ပါ။ မန်နေဂျာ အတည်ပြုပြီးနောက် ပြင်ပေးမည်','[ဒီလ ကျွန်ုပ်၏ အလုပ်ချိန်] တွင် နေ့အလိုက် အချိန်နှင့် စုစုပေါင်း ကြည့်နိုင်သည်','အပေါ်ရှိ 🌐 ခလုတ်ဖြင့် ဘာသာစကား ပြောင်းနိုင်သည်'],
  si:['වැඩබිමට පැමිණි විට QR එක ස්කෑන් කර [වැඩට පැමිණීම] ඔබන්න','වැඩ අවසන් වූ විට නැවත QR එක ස්කෑන් කර [වැඩ අවසන්] ඔබන්න','පළමු වතාවට පමණක් ඔබේ නම තෝරන්න. මෙම දුරකථනය එය මතක තබා ගනී','ස්ථානය (GPS) සැමවිටම සක්‍රියව තබන්න. නැතිනම් ඔබේ වේලාව නිවැරදිව සටහන් නොවිය හැක','සැමවිටම ඔබේම දුරකථනය භාවිතා කරන්න. වෙනත් අයෙකුගේ දුරකථනය භාවිතා නොකරන්න','වේලාව වැරදි නම් හෝ අමතක වුණොත් [මගේ වාර්තාව වැරදියි] තුළින් නිවැරදි වේලාව යවන්න. කළමනාකරු අනුමත කළ පසු නිවැරදි වේ','[මෙම මාසයේ මගේ වැඩ කාලය] තුළ දිනපතා වේලාවන් සහ එකතුව බලන්න','ඉහළ ඇති 🌐 බොත්තමෙන් භාෂාව වෙනස් කරන්න']},

var WD = {ko:'일월화수목금토'.split(''), en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], vi:['CN','T2','T3','T4','T5','T6','T7'],

function pickLang() { return Q.get('lang') || store.get('lang') || NAME_LANG[me] || 'ko'; }
var L = pickLang();
function T(k, a) {
  var s = (TX[k] && (TX[k][L] || TX[k].ko)) || k;
  if (a) Object.keys(a).forEach(function(x) { s = s.split('{' + x + '}').join(a[x]); });
  return s;
}
(function() {
  var sel = document.getElementById('lang');
  LANGS.forEach(function(x) { var o = document.createElement('option'); o.value = x[0]; o.textContent = '🌐 ' + x[1]; sel.appendChild(o); });
  sel.value = L;
  sel.onchange = function() { L = sel.value; store.set('lang', L); document.documentElement.lang = L; render(); };
  document.documentElement.lang = L;
})();

function locate() {
  posErr = '';
  if (!navigator.geolocation) { posErr = 'noGeo'; return; }
  navigator.geolocation.getCurrentPosition(function(p) { pos = p.coords; posErr = ''; },
    function(e) { posErr = e.code === 1 ? 'denied' : 'notFound'; },
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
}
function waitPos(ms) {
  return new Promise(function(res) {
    var t0 = Date.now();
    (function check() { if (pos || posErr || Date.now() - t0 > ms) res(); else setTimeout(check, 200); })();
  });
}
function call(params) {
  params.p = 'att'; params.s = D.site; params.dev = dev;
  if (pos) { params.lat = pos.latitude.toFixed(6); params.lng = pos.longitude.toFixed(6); params.acc = Math.round(pos.accuracy); }
  var q = Object.keys(params).map(function(k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(D.url + '?' + q).then(function(r) { return r.json(); });
}
function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function today() {
  var d = new Date(), M = d.getMonth() + 1, Dd = d.getDate(), w = WDL[L][d.getDay()];
  if (L === 'ko') return M + '월 ' + Dd + '일 ' + w;

  return w + ' · ' + Dd + '/' + M;
}
function hhmm() { var d = new Date(); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
function avatar(name, i) { var a = h('span', 'av', name.length > 2 ? name.slice(-2) : name); a.style.background = COLORS[i % COLORS.length]; return a; }
function visible() { return D.명단.filter(function(x) { return x.이름 !== '테스트' || D.test || me === '테스트'; }); }
function clear() { if (clockTimer) clearInterval(clockTimer); clockTimer = null; var app = document.getElementById('app'); app.innerHTML = ''; return app; }
function mine() { return D.명단.filter(function(x) { return x.이름 === me; })[0]; }

// 위치가 꺼져 있으면 큰 안내 카드
function gpsCard(app) {
  if (!posErr) return;
  var g = h('div', 'gps');
  g.appendChild(h('b', '', T('gpsTitle')));
  g.appendChild(h('p', '', '(' + T(posErr) + ')\n' + T('gpsBody')));
  var r = h('button', 'btn', T('gpsRetry'));
  r.onclick = function() {
    r.disabled = true; r.textContent = T('gpsFinding');
    pos = null; locate();
    waitPos(15000).then(function() { render(); });
  };
  g.appendChild(r);
  app.appendChild(g);
}

function render(msg, cls) {
  var app = clear();
  if (D.setup) return renderSetup(app);
  var w = mine();
  if (!w) return renderPick(app);
  gpsCard(app);
  var c = h('div', 'card');

  c.appendChild(h('div', 'date', today()));
  var clock = h('div', 'clock', hhmm()); c.appendChild(clock);
  clockTimer = setInterval(function() { clock.textContent = hhmm(); }, 5000);
  var b, again;
  if (!w.출근) { b = h('button', 'btn b-in', T('in')); b.onclick = function() { press('in', b); }; }
  else if (!w.퇴근) { b = h('button', 'btn b-out', T('out')); b.onclick = function() { press('out', b); }; }
  else {  // 퇴근까지 찍은 뒤: 오후에 다시 나오면 한 번 더 출근, 잘못 찍었으면 퇴근 다시
    b = h('button', 'btn b-done', T('done')); b.onclick = function() { press('out', b); };
    again = h('button', 'btn b-ghost', T('again')); again.onclick = function() { press('in', again); };
  }
  c.appendChild(b);
  if (again) c.appendChild(again);
  var m = h('div', 'msg ' + (cls || ''), msg || ''); m.id = 'msg'; c.appendChild(m);
  app.appendChild(c);

  var s = h('div', 'card'), t = h('div', 'today');

    var d = h('div', x[1] ? 'on' : ''); d.appendChild(h('span', '', T(x[0]))); d.appendChild(h('b', '', x[1] || '--:--')); t.appendChild(d);
  });
  s.appendChild(t); app.appendChild(s);

  var mm = h('a', 'menu'); mm.href = '#';
  var l = h('div'); l.appendChild(document.createTextNode(T('mine'))); l.appendChild(h('small', '', T('mineSub')));
  mm.appendChild(l); mm.appendChild(h('em', '', '›'));

  app.appendChild(mm);

  var f = h('a', 'menu'); f.href = '#';

  f.appendChild(fl); f.appendChild(h('em', '', '›'));
  f.onclick = function(e) { e.preventDefault(); renderFix(''); };
  app.appendChild(f);

  var hp = h('a', 'menu'); hp.href = '#';
  var hl = h('div'); hl.appendChild(document.createTextNode(T('help'))); hl.appendChild(h('small', '', T('helpSub')));
  hp.appendChild(hl); hp.appendChild(h('em', '', '›'));
  hp.onclick = function(e) { e.preventDefault(); renderHelp(); };

  var a = h('a', 'link', T('notMe')); a.href = '#';

  a.onclick = function(e) { e.preventDefault(); if (w.출근 || w.퇴근) renderFix(WRONG); else forget(); };
  app.appendChild(a);
}

function renderHelp() {

// 서버로는 한국어 값(KINDS)을 보내고, 화면에는 번역(k0~k3)을 보여준다
var WRONG = '다른 사람 이름으로 찍었어요';
var KINDS = [WRONG, '출근·퇴근 시간이 틀려요', '출근이나 퇴근을 못 찍었어요', '기타'];
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

function renderFix(kind) {
  var app = clear(), c = h('div', 'card'), w = mine() || {};
  c.appendChild(h('div', 'hello', T('fixOf', {n: me})));
  c.appendChild(h('div', 'who', T('fixTitle')));
  if (kind === WRONG) c.appendChild(h('div', 'warn', T('wrongWarn', {n: me})));
  var date = h('input', 'field'); date.type = 'date'; date.value = ymd(new Date()); date.max = date.value;
  c.appendChild(h('div', 'label', T('date'))); c.appendChild(date);
  c.appendChild(h('div', 'label', T('what')));
  var picked = kind, opts = h('div', 'opts');

  // 맞는 시간 (다른 사람 이름 고른 경우엔 숨김)
  var tb = h('div'), tIn = h('input', 'field'), tOut = h('input', 'field'), now = h('div', 'now');
  tIn.type = 'time'; tOut.type = 'time';
  tb.appendChild(h('div', 'label', T('times')));
  var tg = h('div', 'times'), a1 = h('label'), a2 = h('label');
  a1.appendChild(h('span', '', T('tIn'))); a1.appendChild(tIn);
  a2.appendChild(h('span', '', T('tOut'))); a2.appendChild(tOut);
  tg.appendChild(a1); tg.appendChild(a2); tb.appendChild(tg); tb.appendChild(now);
  tb.appendChild(h('div', 'now', T('timesHint')));
  function showNow() {
    now.textContent = date.value === ymd(new Date()) ? T('nowRec', {a: w.출근 || '-', b: w.퇴근 || '-'}) : '';
  }
  date.onchange = showNow; showNow();
  function showTimes() { tb.style.display = picked === WRONG ? 'none' : ''; }

  KINDS.forEach(function(k, i) {
    var o = h('button', 'opt' + (k === picked ? ' on' : ''), T('k' + i));
    o.onclick = function() { picked = k; [].forEach.call(opts.children, function(x) { x.className = 'opt' + (x === o ? ' on' : ''); }); showTimes(); };
    opts.appendChild(o);
  });
  c.appendChild(opts);
  c.appendChild(tb); showTimes();
  var memo = h('textarea', 'field'); memo.rows = 3;
  memo.placeholder = kind === WRONG ? T('memoPhWrong') : T('memoPh');
  c.appendChild(h('div', 'label', T('memo'))); c.appendChild(memo);
  var send = h('button', 'btn b-in', T('send')), m = h('div', 'msg');
  send.onclick = function() {
    if (!picked) { m.className = 'msg err'; m.textContent = T('pickKind'); return; }
    var needs = picked === KINDS[1] || picked === KINDS[2];
    if (needs && !tIn.value && !tOut.value) { m.className = 'msg err'; m.textContent = T('needTime'); return; }
    send.disabled = true; send.textContent = T('sending');
    var body = {do: 'fix', name: me, date: date.value, kind: picked, memo: memo.value};
    if (picked !== WRONG) { if (tIn.value) body.in = tIn.value; if (tOut.value) body.out = tOut.value; }
    call(body).then(function(r) {
      if (!r.ok) throw new Error(r.오류 || 'fail');
      if (picked === WRONG) { store.del('name_' + D.site); me = null; }
      var app2 = clear(), d = h('div', 'card');
      d.appendChild(h('div', 'who', T('sent')));
      d.appendChild(h('div', 'hello', T('sentSub')));
      var ok = h('button', 'btn b-ghost', me ? T('toMain') : T('pickName')); ok.onclick = function() { render(); };
      d.appendChild(ok); app2.appendChild(d);
    }).catch(function(e) { send.disabled = false; send.textContent = T('send'); m.className = 'msg err'; m.textContent = T('sendFail') + e.message; });
  };
  c.appendChild(send); c.appendChild(m); app.appendChild(c);
  var back = h('a', 'link', T('cancel')); back.href = '#';
  back.onclick = function(e) { e.preventDefault(); render(); };
  app.appendChild(back);
}

function renderPick(app) {
  var c = h('div', 'card');
  c.appendChild(h('div', 'who', T('pick')));
  c.appendChild(h('div', 'hello', T('pickSub')));
  var g = h('div', 'names');
  visible().forEach(function(w, i) {
    var b = h('button', 'name'); b.appendChild(avatar(w.이름, i)); b.appendChild(document.createTextNode(w.이름));
    b.onclick = function() { askName(w.이름); };
    g.appendChild(b);
  });
  c.appendChild(g); app.appendChild(c);
}

function askName(n) {  // 확인창(confirm)은 막혀 있을 수 있어서 화면으로 묻는다
  var app = clear();
  if (!store.get('lang') && !Q.get('lang') && NAME_LANG[n]) { L = NAME_LANG[n]; document.getElementById('lang').value = L; }
  var c = h('div', 'card');
  c.appendChild(h('div', 'hello', T('confirm')));
  c.appendChild(h('div', 'who', T('isYou', {n: n})));
  var y = h('button', 'btn b-in', T('yes'));
  y.onclick = function() { me = n; store.set('name_' + D.site, me); render(); };
  var no = h('button', 'btn b-ghost', T('no'));
  no.onclick = function() { if (!store.get('lang') && !Q.get('lang')) { L = 'ko'; document.getElementById('lang').value = L; } render(); };
  c.appendChild(y); c.appendChild(no); app.appendChild(c);
}

function press(kind, b) {
  var w = mine();
  if (kind === 'out' && w.퇴근 && !b.armed) { b.armed = true; b.className = 'btn b-out'; b.textContent = T('armOut', {t: hhmm()}); return; }
  if (kind === 'in' && w.퇴근 && !b.armed) { b.armed = true; b.className = 'btn b-in'; b.textContent = T('armIn', {t: hhmm()}); return; }
  b.disabled = true; b.textContent = T('recording');
  if (!pos) { posErr = ''; locate(); }
  waitPos(8000).then(function() { return call({do: kind, name: me}); }).then(function(r) {
    if (!r.ok) throw new Error(r.오류 || 'fail');
    w.출근 = r.출근; w.퇴근 = r.퇴근;
    render(r.이미 ? T('already', {t: r.출근}) : (kind === 'in' ? T('inOk', {t: r.출근}) : T('outOk', {t: r.퇴근})), 'ok');
  }).catch(function(e) {
    b.disabled = false; b.armed = false; b.textContent = kind === 'in' ? T('in') : T('out');
    var m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = T('fail', {e: e.message});
  });
}

var ym = (function() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); })();
function shiftYm(n) { var y = +ym.slice(0, 4), m = +ym.slice(5) + n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } ym = y + '-' + ('0' + m).slice(-2); }
function hm2(s) { var p = String(s).split(':'); return +p[1] ? T('hm', {h: +p[0], m: +p[1]}) : T('hOnly', {h: +p[0]}); }

function renderMine() {
  if (!me) return render();
  var app = clear();
  var c = h('div', 'card');
  c.appendChild(h('div', 'hello', T('nim', {n: me})));
  var nav = h('div', 'nav'); nav.style.marginTop = '8px';
  var prev = h('button', '', '‹'), next = h('button', '', '›');
  prev.onclick = function() { shiftYm(-1); renderMine(); };
  next.onclick = function() { shiftYm(1); renderMine(); };
  nav.appendChild(prev); nav.appendChild(h('div', 't', T('ym', {y: ym.slice(0, 4), m: +ym.slice(5)}))); nav.appendChild(next);
  c.appendChild(nav);
  var body = h('div'); body.appendChild(h('div', 'spin')); c.appendChild(body);
  app.appendChild(c);
  var back = h('a', 'link', T('back')); back.href = '#';
  back.onclick = function(e) { e.preventDefault(); render(); };
  app.appendChild(back);

  var want = ym;
  call({do: 'mine', name: me, ym: ym}).then(function(r) {
    if (want !== ym) return;
    if (!r.ok) throw new Error(r.오류 || 'fail');
    body.innerHTML = '';
    var sum = h('div', 'sum');
    [[T('workDays'), T('days', {n: r.일수})], [T('total'), hm2(r.합계)]].forEach(function(x) { var d = h('div'); d.appendChild(h('span', '', x[0])); d.appendChild(h('b', '', x[1])); sum.appendChild(d); });
    body.appendChild(sum);
    if (!r.목록.length) { body.appendChild(h('div', 'hint', T('noRec'))); return; }
    var t = h('table'), hd = h('tr');
    ['thDate', 'thIn', 'thOut', 'thH'].forEach(function(x) { hd.appendChild(h('th', '', T(x))); });
    t.appendChild(hd);
    r.목록.forEach(function(o) {
      var d = new Date(o.날짜 + 'T00:00:00'), tr = h('tr'), wd = d.getDay();
      var td = h('td', 'd', (d.getMonth() + 1) + '/' + d.getDate() + ' ');
      td.appendChild(h('span', wd === 0 || wd === 6 ? 'we' : '', WD[L][wd]));
      var st = {'대기': ['p', 'stP'], '승인': ['y', 'stY'], '거절': ['n', 'stN']}[o.상태];
      if (st) td.appendChild(h('span', 'st ' + st[0], T(st[1])));
      tr.appendChild(td);
      tr.appendChild(h('td', o.출근 ? '' : 'miss', o.출근 || '-'));
      tr.appendChild(h('td', o.퇴근 ? '' : 'miss', o.퇴근 || '-'));
      tr.appendChild(h('td', o.시간 ? 'h' : 'miss', o.시간 || '-'));
      t.appendChild(tr);
    });
    body.appendChild(t);
    body.appendChild(h('div', 'hint', T('rule')));
  }).catch(function(e) { body.innerHTML = ''; body.appendChild(h('div', 'msg err', e.message)); });
}

function renderSetup(app) {  // 대표 전용 — 한국어만
  var c = h('div', 'card');
  c.appendChild(h('div', 'hello', '대표 전용'));
  c.appendChild(h('div', 'who', D.site + ' 위치 등록'));
  c.appendChild(h('div', 'hint', '세척장 안에서 눌러주세요. 여기서 300m 안에서 누른 기록만 정상으로 봅니다.'));
  var b = h('button', 'btn b-in', '📍 여기가 ' + D.site);
  var m = h('div', 'msg');
  b.onclick = function() {
    b.disabled = true; m.className = 'msg'; m.textContent = '위치 찾는 중…';
    waitPos(15000).then(function() {
      if (!pos) throw new Error(posErr ? T(posErr) : '위치를 못 찾았어요');
      return call({do: 'setup', key: D.setup});
    }).then(function(r) { if (!r.ok) throw new Error(r.오류); m.className = 'msg ok'; m.textContent = '✅ 등록됐어요 (오차 ' + r.정확도 + 'm)'; })
      .catch(function(e) { b.disabled = false; m.className = 'msg err'; m.textContent = e.message; });
  };
  c.appendChild(b); c.appendChild(m); app.appendChild(c);
}

locate();
if (D.setup) render();
else {
  call({do: 'list'}).then(function(r) {
    if (!r.ok) throw new Error(r.오류 || 'fail');
    D.명단 = r.명단;
    if (Q.get('v') === 'mine' && mine()) renderMine(); else render();
    // 위치 응답이 늦게 오면(권한 거부 등) 안내 카드를 보여주려고 한 번 더 그린다
    waitPos(16000).then(function() { if (posErr && document.querySelector('.clock') && !document.querySelector('.gps')) render(); });
  }).catch(function(e) {
    var app = clear(), c = h('div', 'card');
    c.appendChild(h('div', 'msg err', T('loadFail')));
    c.appendChild(h('div', 'hint', e.message + ' — ' + T('loadHint')));
    app.appendChild(c);
  });
}
</script>
</body>
</html>
