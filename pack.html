<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포장 수량 조회</title>
<style>
  :root { --green:#2e7d32; --dark:#1b5e20; --pale:#f1f8f1; --line:#e3ebe3; --gray:#6b776b; --red:#c62828; --redbg:#ffebee; --text:#263238; --bg:#f6f8f6; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--green); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:5; }
  h1 { margin:0 0 10px; font-size:20px; }
  .row { display:flex; gap:8px; }
  input { flex:1; font-size:17px; padding:11px 12px; border:0; border-radius:10px; min-width:0; }
  button.reload { border:0; border-radius:10px; background:#1b5e20; color:#fff; font-size:15px; padding:0 14px; }
  .meta { font-size:12px; opacity:.85; margin-top:8px; }
  main { padding:12px 16px 40px; max-width:640px; margin:0 auto; }
  .list .org { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:8px; font-size:17px; font-weight:600; cursor:pointer; }
  .list .org small { color:var(--gray); font-weight:500; font-size:14px; }
  .org.changed { border-color:#ef9a9a; background:var(--redbg); }
  .badge { display:inline-block; background:var(--red); color:#fff; border-radius:6px; font-size:11px; padding:2px 6px; margin-left:6px; vertical-align:middle; }
  .back { background:none; border:0; color:var(--green); font-size:16px; padding:4px 0 10px; cursor:pointer; }
  .title { font-size:22px; font-weight:700; margin:0 0 4px; }
  .sum { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0 14px; }
  .sum div { background:var(--pale); border-radius:10px; padding:10px; text-align:center; }
  .sum b { display:block; font-size:22px; color:var(--dark); }
  .sum span { font-size:12px; color:var(--gray); }
  .cls { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .cls.changed { border-color:#ef9a9a; background:var(--redbg); }
  .cls .name { font-size:17px; font-weight:700; margin-bottom:8px; }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
  .nums span { display:block; font-size:12px; color:var(--gray); }
  .nums b { font-size:20px; }
  .nums .pack b { color:var(--green); font-size:24px; }
  .note { margin-top:8px; font-size:14px; background:#fff8e1; border-radius:8px; padding:6px 8px; }
  .chg { margin-top:6px; font-size:13px; color:var(--red); font-weight:600; }
  .msg { text-align:center; color:var(--gray); padding:30px 0; }
</style>
</head>
<body>
<header>
  <h1>포장 수량 조회</h1>
  <div class="row">
    <input id="q" type="search" placeholder="기관 이름 검색" autocomplete="off">
    <button class="reload" id="reload">새로고침</button>
  </div>
  <div class="meta" id="meta">불러오는 중…</div>
</header>
<main id="main"><div class="msg">불러오는 중…</div></main>
<script>
const SHEET = '1KG3RyMOiplZ2eqSpdcpe2yncNw1Vm4EFsCdQOjuLtcQ';
const URL_ = 'https://docs.google.com/spreadsheets/d/' + SHEET + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('반별원아수');
const CHANGE_DAYS = 2;
let orgs = [], updated = '', current = null;

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const num = v => { const n = parseFloat(String(v || '').replace(/,/g, '')); return isNaN(n) ? null : n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 변경시각은 "11/11 16:20" 형식 (연도 없음)
function recent(s) {
  const m = String(s || '').match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (!m) return false;
  const now = new Date();
  let d = new Date(now.getFullYear(), m[1]-1, m[2], m[3], m[4]);
  if (d > now) d.setFullYear(d.getFullYear() - 1);
  return (now - d) < CHANGE_DAYS * 86400000;
}

async function load() {
  document.getElementById('meta').textContent = '불러오는 중…';
  try {
    const res = await fetch(URL_ + '&_=' + Date.now());
    const rows = parseCSV(await res.text());
    updated = (rows[0] && rows[0][11]) || '';
    const map = new Map();
    rows.slice(1).forEach(r => {
      const org = (r[0] || '').trim(); if (!org) return;
      if (!map.has(org)) map.set(org, { name: org, classes: [] });
      map.get(org).classes.push({
        cls: (r[1] || '').trim(), kids: num(r[2]), teacher: num(r[3]), pack: num(r[4]),
        memo: (r[5] || '').trim(), memoDate: (r[6] || '').trim(),
        changed: recent(r[7]), prev: num(r[8]), changedAt: (r[7] || '').trim()
      });
    });
    orgs = [...map.values()];
    orgs.forEach(o => {
      o.kids = o.classes.reduce((a, c) => a + (c.kids || 0), 0);
      o.teacher = o.classes.reduce((a, c) => a + (c.teacher || 0), 0);
      o.pack = o.classes.reduce((a, c) => a + (c.pack != null ? c.pack : (c.kids || 0) + (c.teacher || 0)), 0);
      o.changed = o.classes.some(c => c.changed);
    });
    document.getElementById('meta').textContent = orgs.length + '개 기관 · 마지막 갱신 ' + (updated || '-');
    current ? showOrg(current) : showList();
  } catch (e) {
    document.getElementById('meta').textContent = '불러오기 실패 — 새로고침을 눌러 주세요';
    document.getElementById('main').innerHTML = '<div class="msg">인터넷 연결을 확인해 주세요.</div>';
  }
}

function showList() {
  current = null;
  const q = document.getElementById('q').value.trim();
  const list = orgs.filter(o => !q || o.name.includes(q));
  document.getElementById('main').innerHTML = list.length
    ? '<div class="list">' + list.map(o =>
        '<div class="org' + (o.changed ? ' changed' : '') + '" data-org="' + esc(o.name) + '"><span>' + esc(o.name) +
        (o.changed ? '<span class="badge">변경</span>' : '') + '</span><small>포장 ' + o.pack + '개</small></div>').join('') + '</div>'
    : '<div class="msg">검색 결과가 없어요.</div>';
  document.querySelectorAll('.org').forEach(el => el.onclick = () => { showOrg(el.dataset.org); window.scrollTo(0, 0); });
}

function showOrg(name) {
  const o = orgs.find(x => x.name === name);
  if (!o) return showList();
  current = name;
  history.replaceState(null, '', '#' + encodeURIComponent(name));
  let h = '<button class="back" id="back">← 기관 목록</button>';
  h += '<div class="title">' + esc(o.name) + '</div>';
  h += '<div class="sum"><div><b>' + o.kids + '</b><span>원아수</span></div><div><b>' + o.teacher + '</b><span>교사용식판</span></div><div><b>' + o.pack + '</b><span>포장 수량</span></div></div>';
  o.classes.forEach(c => {
    const pack = c.pack != null ? c.pack : (c.kids || 0) + (c.teacher || 0);
    h += '<div class="cls' + (c.changed ? ' changed' : '') + '"><div class="name">' + esc(c.cls || '(반 구분 없음)') + '</div>';
    h += '<div class="nums"><div><span>원아수</span><b>' + (c.kids ?? '-') + '</b></div><div><span>교사용</span><b>' + (c.teacher ?? '-') + '</b></div><div class="pack"><span>포장</span><b>' + pack + '</b></div></div>';
    if (c.changed) h += '<div class="chg">원아수 변경: ' + (c.prev ?? '?') + ' → ' + (c.kids ?? '?') + ' (' + esc(c.changedAt) + ')</div>';
    if (c.memo) h += '<div class="note">메모: ' + esc(c.memo) + (c.memoDate ? ' <small>(' + esc(c.memoDate) + ')</small>' : '') + '</div>';
    h += '</div>';
  });
  document.getElementById('main').innerHTML = h;
  document.getElementById('back').onclick = () => { history.replaceState(null, '', location.pathname); showList(); };
}

document.getElementById('q').addEventListener('input', () => { if (current) history.replaceState(null, '', location.pathname); showList(); });
document.getElementById('reload').onclick = load;
const hash = decodeURIComponent(location.hash.slice(1));
if (hash) current = hash;
load();
</script>
</body>
</html>
